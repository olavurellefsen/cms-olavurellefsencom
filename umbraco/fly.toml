app = "olavurellefsen-umbraco"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "OlavurEllefsen.Umbraco/Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_FORWARDEDHEADERS_ENABLED = "true"
  ASPNETCORE_HTTP_PORTS = "8080"
  ConnectionStrings__umbracoDbDSN = "Data Source=/data/Umbraco.sqlite.db;Cache=Shared;Foreign Keys=True;Pooling=True"
  ConnectionStrings__umbracoDbDSN_ProviderName = "Microsoft.Data.Sqlite"
  DataProtection__KeysPath = "/data/data-protection"
  Umbraco__CMS__Global__UseHttps = "true"
  Umbraco__CMS__Unattended__InstallUnattended = "true"
  Umbraco__CMS__Unattended__UpgradeUnattended = "true"
  Umbraco__CMS__WebRouting__UmbracoApplicationUrl = "https://olavurellefsen-umbraco.fly.dev"
  UsableProjection__ApiBaseUrl = "https://usable.dev"

[http_service]
  auto_start_machines = true
  auto_stop_machines = "off"
  force_https = true
  internal_port = 8080
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[mounts]
  source = "umbraco_data"
  destination = "/data"
  snapshot_retention = 14

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
